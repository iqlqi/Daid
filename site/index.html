<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daid</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at top, #25205c, #0b1020 60%);
      }

      main {
        max-width: 42rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 5rem);
        background: linear-gradient(135deg, #a78bfa, #38bdf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 1.2rem;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Daid</h1>
      <p>صفحة تعريفية لشركة ناشئة في الذكاء الاصطناعي بتصميم داكن بالبنفسجي والأزرق</p>
    </main>
  </body>
</html>
